name: Documentation Deployment

on:
  push:
    branches: [master]

  # 'workflow_dispatch' allows manual execution of this workflow under the repository's 'Actions' tab
  workflow_dispatch:

jobs:
  build:
    name: Deploy Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: ammaraskar/sphinx-action@master
        with:
          docs-folder: "doc/user_manual"
          pre-build-command: "pip install -r doc/user_manual/requirements.txt --upgrade pip"

      # Create an artifact of the html output
      - uses: actions/upload-artifact@v7
        with:
          name: documentation_html
          path: doc/user_manual/_build/html/

      # Publish built docs to gh-pages branch
      - name: Commit documentation changes
        run: |
          git clone https://github.com/spacelab-ufsc/obdh2.git --branch gh-pages --single-branch gh-pages
          cd gh-pages
          rm -rf *
          rm -f .nojekyll
          rm -f .gitignore
          rm -rf .github/
          cp -r ../doc/user_manual/_build/html/* .
          touch .nojekyll
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update documentation" -a || true

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          branch: gh-pages
          directory: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
